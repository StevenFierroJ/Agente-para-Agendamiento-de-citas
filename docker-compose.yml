services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pg_datos:
  mongo_datos:
